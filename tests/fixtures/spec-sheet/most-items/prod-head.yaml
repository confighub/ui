apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "openclaw"
  namespace: "confighubplaceholder"
  labels:
    app: "openclaw"
    environment: "prod"
  annotations:
    confighub.com/owner: "platform-team"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: "openclaw"
  strategy:
    type: "Recreate"
  template:
    metadata:
      labels:
        app: "openclaw"
        environment: "prod"
      annotations:
        confighub.com/Hash: "confighubplaceholder"
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: "RuntimeDefault"
      initContainers:
        - name: "init-config"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          image: "busybox:1.37"
          imagePullPolicy: "IfNotPresent"
          command:
            - "sh"
            - "-c"
            - "cp /config/openclaw.json /home/node/.openclaw/openclaw.json\nmkdir -p /home/node/.openclaw/workspace\ncp /config/AGENTS.md /home/node/.openclaw/workspace/AGENTS.md"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          volumeMounts:
            - name: "openclaw-home"
              mountPath: "/home/node/.openclaw"
            - name: "openclaw-config"
              mountPath: "/config/openclaw.json"
              subPath: "openclaw.json"
            - name: "openclaw-context"
              mountPath: "/config/AGENTS.md"
              subPath: "AGENTS.md"
      containers:
        - name: "gateway"
          ports:
            - name: "gateway"
              containerPort: 18789
              protocol: "TCP"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          image: "ghcr.io/openclaw/openclaw:slim"
          imagePullPolicy: "IfNotPresent"
          command:
            - "node"
            - "/app/dist/index.js"
            - "gateway"
            - "run"
          env:
            - name: "HOME"
              value: "/home/node"
            - name: "OPENCLAW_CONFIG_DIR"
              value: "/home/node/.openclaw"
            - name: "NODE_ENV"
              value: "production"
            - name: "OPENCLAW_GATEWAY_TOKEN"
              valueFrom:
                secretKeyRef:
                  name: "openclaw-secrets"
                  key: "OPENCLAW_GATEWAY_TOKEN"
            - name: "ANTHROPIC_API_KEY"
              valueFrom:
                secretKeyRef:
                  name: "openclaw-secrets"
                  key: "ANTHROPIC_API_KEY"
                  optional: true
            - name: "OPENAI_API_KEY"
              valueFrom:
                secretKeyRef:
                  name: "openclaw-secrets"
                  key: "OPENAI_API_KEY"
                  optional: true
            - name: "GEMINI_API_KEY"
              valueFrom:
                secretKeyRef:
                  name: "openclaw-secrets"
                  key: "GEMINI_API_KEY"
                  optional: true
            - name: "OPENROUTER_API_KEY"
              valueFrom:
                secretKeyRef:
                  name: "openclaw-secrets"
                  key: "OPENROUTER_API_KEY"
                  optional: true
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "4Gi"
              cpu: 1
          livenessProbe:
            exec:
              command:
                - "node"
                - "-e"
                - "require('http').get('http://127.0.0.1:18789/healthz', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - "node"
                - "-e"
                - "require('http').get('http://127.0.0.1:18789/readyz', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: "openclaw-home"
              mountPath: "/home/node/.openclaw"
            - name: "tmp-volume"
              mountPath: "/tmp"
      volumes:
        - name: "openclaw-home"
          persistentVolumeClaim:
            claimName: "openclaw-home-pvc"
        - name: "openclaw-config"
          configMap:
            name: "confighubplaceholder"
        - name: "openclaw-context"
          configMap:
            name: "confighubplaceholder"
        - name: "tmp-volume"
          emptyDir: {}
