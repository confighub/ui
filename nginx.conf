pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Everything nginx writes goes under /tmp, the one writable directory the
    # container needs, so the root filesystem can be read-only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # Runtime configuration — read on every boot of the app, never cached.
        # docker-entrypoint.sh writes it to /tmp, outside the read-only root.
        location = /config.json {
            alias /tmp/config.json;
            add_header Cache-Control "no-store";
        }

        # Hashed assets — cache aggressively
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # HTML and SPA fallback — never serve stale
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
