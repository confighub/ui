name: Plugin UI bundle
on:
  push:
    tags: ['plugin-ui-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build:plugin
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.pure.config.ts
      - run: npm run test:plugin
      - run: node scripts/archive-plugin-ui.mjs
      - name: Publish the optional static bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest=false \
            --title "Plugin UI ${GITHUB_REF_NAME#plugin-ui-v}" \
            --notes-file docs/dev/plugin-ui/release-notes.md \
            release/confighub-plugin-ui.tar.gz release/confighub-plugin-ui.tar.gz.sha256
