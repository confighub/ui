name: CI

# Lint, typecheck, production build and the specs that need no ConfigHub instance.
on:
  push:
    branches: [main]
    # A change to the workflows alone has nothing to check (and before the first release,
    # no code to check).
    paths-ignore: ['.github/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # tsc -b, then the Vite production bundle.
      - run: npm run build
      - run: test -f dist/index.html
      # The specs that need no ConfigHub instance. The rest run against a live instance
      # and a test user; see README.
      # Playwright does not yet recognize the runner's Ubuntu release, so it refuses to
      # download a browser for it. The Ubuntu 24.04 build runs on it.
      - run: |
          npx playwright install-deps chromium
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64 npx playwright install chromium
      - run: npx playwright test -c playwright.pure.config.ts
