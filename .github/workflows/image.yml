name: Image

# Builds the UI image on each release tag and pushes it to GHCR as ghcr.io/confighub/ui,
# tagged with the version (0.6.3), its minor line (0.6) and `latest`. Release tags arrive
# with each ConfigHub release, together with the code they tag. The image is configured
# at runtime (see README), so the same image works with any ConfigHub instance.
# Pull requests (and a manual run on a branch) build it without pushing; a manual run on
# a tag rebuilds that release.
#
# Each architecture is built natively on a runner of that architecture (an emulated
# arm64 build takes twenty minutes; a native one takes two), then the two are joined
# into one multi-arch manifest.
on:
  push:
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/confighub/ui

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    outputs:
      digest-amd64: ${{ steps.push.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.push.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=ConfigHub UI
          # Per-arch images are pushed by digest only; the tags go on the manifest.
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          outputs: ${{ startsWith(github.ref, 'refs/tags/v') && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=docker' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - id: push
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "digest-${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  manifest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Join the per-arch images into one tagged manifest
        run: |
          set -euo pipefail
          tags=$(echo '${{ steps.meta.outputs.json }}' | jq -r '.tags[] | "-t " + .' | tr '\n' ' ')
          docker buildx imagetools create $tags \
            "$IMAGE@${{ needs.build.outputs.digest-amd64 }}" \
            "$IMAGE@${{ needs.build.outputs.digest-arm64 }}"
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
